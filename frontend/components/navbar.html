<header class="navbar">
  <div class="navbar-start">
    <button class="btn btn-icon navbar-burger" id="sidebarToggle" type="button" aria-label="Toggle menu" title="Toggle menu">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <nav class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb"></nav>
  </div>

  <div class="navbar-end">
    <div class="navbar-search" role="search">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="search" class="navbar-search-input" placeholder="Search…" data-i18n-ph="nav.search" aria-label="Search" />
    </div>

    <button class="btn btn-icon" id="navThemeToggle" type="button" aria-label="Toggle theme" title="Toggle theme">
      <svg class="icon" data-theme-icon="dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
      <svg class="icon" data-theme-icon="light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none;">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
      </svg>
    </button>

    <button class="btn btn-icon" id="navLangToggle" type="button" aria-label="Switch language" title="العربية">ع</button>

    <button class="btn btn-icon navbar-notif" id="navNotifications" type="button" aria-label="Notifications" title="Notifications">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span class="notif-dot" aria-hidden="true"></span>
    </button>

    <button class="navbar-user" id="navUser" type="button" aria-label="User menu">
      <span class="navbar-avatar">KD</span>
      <span class="navbar-user-name">Khaled Daidar</span>
    </button>
  </div>
</header>
