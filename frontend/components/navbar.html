<header class="navbar">
  <!-- Top progress bar: real % during sync -->
  <div id="navbarSyncProgress" class="navbar-sync-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div id="navbarSyncProgressFill" class="navbar-sync-progress-fill"></div>
  </div>

  <div class="navbar-start">
    <button class="btn btn-icon navbar-burger" id="sidebarToggle" type="button" aria-label="Toggle menu" title="Toggle menu">
      <i data-lucide="menu" class="icon"></i>
    </button>
    <a class="navbar-brand" href="./dashboard.html">
      <span class="navbar-logo" aria-hidden="true">
        <svg width="24" height="24" style="width:24px;height:24px;max-width:24px;max-height:24px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
      </span>
      <span class="navbar-brand-name" data-i18n="appName">Spark Engineering</span>
    </a>
  </div>

  <div class="navbar-end">
    <!-- Sync badge: shows status icon + pending count -->
    <button class="btn btn-icon navbar-sync-btn" id="navSyncBadge" type="button" aria-label="Sync Status" title="Sync Status">
      <span id="syncBadgeIcon">🟢</span>
      <span id="syncBadgeCount" class="sync-badge-count" hidden>0</span>
    </button>

    <button class="btn btn-icon" id="navLangToggle" type="button" aria-label="Switch language" title="العربية">
      <span id="navLangText">ع</span>
    </button>

    <button class="btn btn-icon" id="navThemeToggle" type="button" aria-label="Toggle theme" title="Toggle theme">
      <span id="navThemeIconWrap">
        <i data-lucide="moon" class="icon"></i>
      </span>
    </button>

    <button class="btn btn-icon" id="navLogout" type="button" aria-label="Logout" title="Logout">
      <i data-lucide="log-out" class="icon"></i>
    </button>

    <button class="navbar-user" id="navUser" type="button" aria-label="User menu" title="User menu">
      <span class="navbar-avatar">Eng Mo</span>
    </button>
  </div>
</header>

<!-- Sync Panel: slides down when offline→online transition with pending changes -->
<div id="syncPanel" class="sync-panel" role="status" aria-live="polite" hidden>
  <div class="sync-panel-inner">
    <div class="sync-panel-header">
      <span class="sync-panel-title" id="syncPanelTitle">🔄 جاري المزامنة...</span>
      <button class="sync-panel-close" id="syncPanelClose" type="button" aria-label="إغلاق">✕</button>
    </div>
    <div class="sync-panel-progress-wrap">
      <div class="sync-panel-track">
        <div id="syncPanelBar" class="sync-panel-bar" style="width: 0%"></div>
      </div>
      <span id="syncPanelPercent" class="sync-panel-percent">0%</span>
    </div>
    <div class="sync-panel-footer">
      <span id="syncPanelDetail" class="sync-panel-detail">يتم رفع التغييرات المعلقة...</span>
      <button id="syncPanelRetry" class="btn btn-xs btn-soft sync-panel-retry" type="button" hidden>
        <i data-lucide="refresh-cw" class="icon" style="width:12px;height:12px;"></i>
        إعادة مزامنة
      </button>
    </div>
  </div>
</div>
