<header class="navbar">
  <div class="navbar-start">
    <button class="btn btn-icon navbar-burger" id="sidebarToggle" type="button" aria-label="Toggle menu" title="Toggle menu">
      <i data-lucide="menu" class="icon"></i>
    </button>
    <nav class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb"></nav>
  </div>

  <div class="navbar-end">
    <div class="navbar-search" role="search">
      <i data-lucide="search" class="icon"></i>
      <input type="search" class="navbar-search-input" placeholder="Search…" data-i18n-ph="nav.search" aria-label="Search" />
    </div>

    <button class="btn btn-icon" id="navThemeToggle" type="button" aria-label="Toggle theme" title="Toggle theme">
      <i data-lucide="moon" class="icon" data-theme-icon="dark"></i>
      <i data-lucide="sun" class="icon" data-theme-icon="light" style="display:none;"></i>
    </button>

    <button class="btn btn-icon" id="navLangToggle" type="button" aria-label="Switch language" title="العربية">ع</button>

    <button class="btn btn-icon navbar-notif" id="navNotifications" type="button" aria-label="Notifications" title="Notifications">
      <i data-lucide="bell" class="icon"></i>
      <span class="notif-dot" aria-hidden="true"></span>
    </button>

    <button class="navbar-user" id="navUser" type="button" aria-label="User menu">
      <span class="navbar-avatar">KD</span>
      <span class="navbar-user-name">Khaled Daidar</span>
    </button>
  </div>
</header>
