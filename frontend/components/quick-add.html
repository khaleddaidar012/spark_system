<!-- Quick Add — floating action button + menu + flows -->
<div class="quick-add" id="quickAdd">
  <button class="fab" id="fab" type="button" aria-label="Quick Add" title="Quick Add">
    <i data-lucide="plus" class="icon fab-icon-open"></i>
    <i data-lucide="x" class="icon fab-icon-close"></i>
  </button>

  <div class="fab-menu" id="fabMenu" hidden>
    <button class="fab-menu-item fab-money" id="fabMoney" type="button">
      <span class="fab-menu-icon" aria-hidden="true"><i data-lucide="banknote" class="icon"></i></span>
      <span class="fab-menu-label">
        <strong data-i18n="quick.money">Quick Money</strong>
        <small data-i18n="quick.moneyDesc">Incoming / outgoing payment</small>
      </span>
    </button>
    <button class="fab-menu-item fab-money-split" id="fabMoneySplit" type="button">
      <span class="fab-menu-icon" aria-hidden="true"><i data-lucide="split-square-vertical" class="icon"></i></span>
      <span class="fab-menu-label">
        <strong data-i18n="quick.moneySplit">Quick Money Split</strong>
        <small data-i18n="quick.moneySplitDesc">Split payment across projects</small>
      </span>
    </button>
    <button class="fab-menu-item fab-materials" id="fabMaterials" type="button">
      <span class="fab-menu-icon" aria-hidden="true"><i data-lucide="package" class="icon"></i></span>
      <span class="fab-menu-label">
        <strong data-i18n="quick.materials">Quick Materials</strong>
        <small data-i18n="quick.materialsDesc">Incoming / outgoing materials</small>
      </span>
    </button>
  </div>
</div>

<!-- Quick Money modal -->
<div class="modal-overlay is-sheet" id="quickMoneyModal" hidden>
  <div class="modal modal-sm" role="dialog" aria-modal="true" aria-labelledby="quickMoneyTitle">
    <div class="modal-header">
      <h2 class="modal-title" id="quickMoneyTitle" data-i18n="quick.money">Quick Money</h2>
      <button class="btn btn-icon modal-close" id="quickMoneyClose" type="button" aria-label="Close">
        <i data-lucide="x" class="icon"></i>
      </button>
    </div>
    <form id="quickMoneyForm" class="modal-body form-stack" novalidate>
      <div class="segmented" id="moneyDirection" role="group" aria-label="Direction">
        <button class="segmented-btn" type="button" data-value="in">
          <i data-lucide="arrow-down-circle" class="icon"></i>
          <span data-i18n="quick.incoming">Incoming</span>
        </button>
        <button class="segmented-btn is-active" type="button" data-value="out">
          <i data-lucide="arrow-up-circle" class="icon"></i>
          <span data-i18n="quick.outgoing">Outgoing</span>
        </button>
      </div>

      <div class="form-field">
        <label class="form-label" for="moneyProject" data-i18n="quick.project">Project</label>
        <select class="form-input" id="moneyProject">
          <option value="" data-i18n="quick.noProject">— No project —</option>
        </select>
      </div>

      <div class="form-field" id="moneyPhaseField" hidden>
        <label class="form-label" for="moneyPhase">مرحلة المشروع / Phase</label>
        <select class="form-input" id="moneyPhase">
          <option value="">— اختر المرحلة / Choose Phase —</option>
        </select>
      </div>

      <div class="form-field" id="moneySubphaseField" hidden>
        <label class="form-label" for="moneySubphase">المرحلة الفرعية / Sub-phase</label>
        <select class="form-input" id="moneySubphase">
          <option value="">— اختر المرحلة الفرعية —</option>
        </select>
      </div>

      <div class="chip-row" id="moneyPersonType" role="group" aria-label="Person type">
        <button class="chip is-active" type="button" data-value="supplier"><i data-lucide="truck" class="icon"></i><span data-i18n="quick.supplier">Supplier</span></button>
        <button class="chip" type="button" data-value="contractor"><i data-lucide="hard-hat" class="icon"></i><span data-i18n="quick.contractor">Contractor</span></button>
        <button class="chip" type="button" data-value="client"><i data-lucide="user" class="icon"></i><span data-i18n="quick.client">Client</span></button>
        <button class="chip" type="button" data-value="other"><i data-lucide="more-horizontal" class="icon"></i><span data-i18n="quick.other">Other</span></button>
      </div>

      <div class="form-field" id="moneyPersonField">
        <label class="form-label" data-i18n="quick.person">Person</label>
        <div class="field-with-action">
          <select class="form-input" id="moneyPersonSelect"></select>
          <button class="btn btn-soft btn-icon" id="moneyAddPersonBtn" type="button" data-i18n-aria="quickAdd.add" aria-label="Quick add person" title="Quick add person">
            <i data-lucide="plus" class="icon"></i>
          </button>
        </div>
        <input class="form-input" id="moneyPersonName" type="text" hidden data-i18n-ph="quick.personNamePh" placeholder="Person name" />
      </div>

      <div class="form-field">
        <label class="form-label" for="moneyAmount" data-i18n="quick.amount">Amount</label>
        <input class="form-input" id="moneyAmount" name="amount" type="number" min="0" step="0.01" required data-i18n-ph="quick.amountPh" placeholder="0" />
      </div>

      <div class="form-field">
        <label class="form-label" for="moneyNote" data-i18n="quick.note">Note (optional)</label>
        <input class="form-input" id="moneyNote" name="note" type="text" data-i18n-ph="quick.notePh" placeholder="—" />
      </div>

      <!-- Invoice Attachment -->
      <div class="invoice-upload-section">
        <span class="invoice-upload-label">فاتورة (اختياري) / Invoice (optional)</span>
        <div class="invoice-upload-btns">
          <label class="btn btn-soft btn-sm invoice-pick-btn" title="اختيار من المعرض / Gallery" aria-label="Attach image or PDF">
            <i data-lucide="paperclip" class="icon"></i>
            <input type="file" id="moneyInvoiceFile" accept="image/*,application/pdf" hidden />
          </label>
          <label class="btn btn-soft btn-sm invoice-pick-btn" title="التقاط صورة / Camera" aria-label="Take photo">
            <i data-lucide="camera" class="icon"></i>
            <input type="file" id="moneyInvoiceCamera" accept="image/*" capture="environment" hidden />
          </label>
        </div>
        <div class="invoice-preview" id="moneyInvoicePreview" hidden>
          <img id="moneyInvoiceThumb" src="" alt="Invoice preview" class="invoice-thumb" hidden />
          <span id="moneyInvoicePdfIcon" class="invoice-pdf-icon" hidden>
            <i data-lucide="file-text" class="icon"></i>
            <span id="moneyInvoicePdfName" class="invoice-pdf-name"></span>
          </span>
          <button type="button" class="invoice-remove-btn" id="moneyInvoiceRemove" aria-label="Remove invoice">
            <i data-lucide="x" class="icon"></i>
          </button>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn btn-ghost" id="quickMoneyCancel" type="button" data-i18n="projects.cancel">Cancel</button>
        <button class="btn btn-primary" type="submit" data-i18n="quick.save">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- Quick Materials modal -->
<div class="modal-overlay is-sheet" id="quickMatModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="quickMatTitle">
    <div class="modal-header">
      <h2 class="modal-title" id="quickMatTitle" data-i18n="quick.materials">Quick Materials</h2>
      <button class="btn btn-icon modal-close" id="quickMatClose" type="button" aria-label="Close">
        <i data-lucide="x" class="icon"></i>
      </button>
    </div>
    <form id="quickMatForm" class="modal-body form-stack" novalidate>
      <div class="segmented" id="matDirection" role="group" aria-label="Direction">
        <button class="segmented-btn is-active" type="button" data-value="in">
          <i data-lucide="arrow-down-circle" class="icon"></i>
          <span data-i18n="quick.incoming">Incoming</span>
        </button>
        <button class="segmented-btn" type="button" data-value="out">
          <i data-lucide="arrow-up-circle" class="icon"></i>
          <span data-i18n="quick.outgoing">Outgoing</span>
        </button>
      </div>

      <div class="form-field">
        <label class="form-label" for="qmProject" data-i18n="quick.project">Project</label>
        <select class="form-input" id="qmProject" required></select>
      </div>

      <div class="form-field" id="qmSupplierField">
        <label class="form-label" for="qmSupplier" data-i18n="quick.supplier">Supplier</label>
        <div class="field-with-action">
          <select class="form-input" id="qmSupplier"></select>
          <button class="btn btn-soft btn-icon" id="qmAddSupplierBtn" type="button" data-i18n-aria="quickAdd.add" aria-label="Quick add supplier" title="Quick add supplier">
            <i data-lucide="plus" class="icon"></i>
          </button>
        </div>
      </div>

      <div class="form-field">
        <label class="form-label" for="qmName" data-i18n="quick.material">Material</label>
        <input class="form-input" id="qmName" name="name" type="text" list="qmSuggestions" required data-i18n-ph="quick.materialPh" placeholder="e.g. Cement" />
        <datalist id="qmSuggestions"></datalist>
      </div>

      <div class="form-field" id="qmContractorField">
        <label class="form-label" for="qmContractor" data-i18n="project.formMatContractor">Assigned Contractor</label>
        <select class="form-input" id="qmContractor">
          <option value="" data-i18n="project.formMatContractorNone">No contractor</option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label class="form-label" for="qmQty" data-i18n="quick.quantity">Quantity</label>
          <input class="form-input" id="qmQty" name="quantity" type="number" min="0" step="0.001" required data-i18n-ph="quick.quantityPh" placeholder="0" />
        </div>
        <div class="form-field">
          <label class="form-label" for="qmUnit" data-i18n="quick.unit">Unit</label>
          <input class="form-input" id="qmUnit" name="unit" type="text" data-i18n-ph="quick.unitPh" placeholder="bag" />
        </div>
      </div>

      <div class="form-field" id="qmPriceField">
        <label class="form-label" for="qmPrice" data-i18n="quick.price">Unit Price</label>
        <input class="form-input" id="qmPrice" name="unitPrice" type="number" min="0" step="0.01" required data-i18n-ph="quick.pricePh" placeholder="0" />
      </div>

      <div class="form-field" id="qmTotalField">
        <label class="form-label" for="qmTotal">الإجمالي / Total Cost</label>
        <input class="form-input" id="qmTotal" name="total" type="text" readonly placeholder="0.00" style="background: var(--bg-alt); font-weight: bold; color: var(--text);" />
      </div>

      <div class="form-field" id="qmPayNowField" style="margin-top: -0.5rem;">
        <label class="form-label" style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
          <input type="checkbox" id="qmPayNow" style="width: 1.25rem; height: 1.25rem;" />
          <span style="font-weight: 600;">دفع الآن / Pay Now</span>
        </label>
        <div class="form-hint" style="font-size: 0.85rem; color: var(--text-dim); margin-top: 0.25rem;">
          سيتم تسجيل الفلوس كمدفوعة من الخزنة للمورد/المقاول فوراً.
        </div>
      </div>

      <!-- Invoice Attachment -->
      <div class="invoice-upload-section">
        <span class="invoice-upload-label">فاتورة (اختياري) / Invoice (optional)</span>
        <div class="invoice-upload-btns">
          <label class="btn btn-soft btn-sm invoice-pick-btn" title="اختيار من المعرض / Gallery" aria-label="Attach image or PDF">
            <i data-lucide="paperclip" class="icon"></i>
            <input type="file" id="matInvoiceFile" accept="image/*,application/pdf" hidden />
          </label>
          <label class="btn btn-soft btn-sm invoice-pick-btn" title="التقاط صورة / Camera" aria-label="Take photo">
            <i data-lucide="camera" class="icon"></i>
            <input type="file" id="matInvoiceCamera" accept="image/*" capture="environment" hidden />
          </label>
        </div>
        <div class="invoice-preview" id="matInvoicePreview" hidden>
          <img id="matInvoiceThumb" src="" alt="Invoice preview" class="invoice-thumb" hidden />
          <span id="matInvoicePdfIcon" class="invoice-pdf-icon" hidden>
            <i data-lucide="file-text" class="icon"></i>
            <span id="matInvoicePdfName" class="invoice-pdf-name"></span>
          </span>
          <button type="button" class="invoice-remove-btn" id="matInvoiceRemove" aria-label="Remove invoice">
            <i data-lucide="x" class="icon"></i>
          </button>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn btn-ghost" id="quickMatCancel" type="button" data-i18n="projects.cancel">Cancel</button>
        <button class="btn btn-primary" type="submit" data-i18n="quick.save">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- Quick Money Split modal -->
<div class="modal-overlay is-sheet" id="quickMoneySplitModal" hidden>
  <div class="modal modal-lg" role="dialog" aria-modal="true" aria-labelledby="quickMoneySplitTitle">
    <div class="modal-header">
      <h2 class="modal-title" id="quickMoneySplitTitle" data-i18n="quick.moneySplit">Quick Money Split</h2>
      <button class="btn btn-icon modal-close" id="quickMoneySplitClose" type="button" aria-label="Close">
        <i data-lucide="x" class="icon"></i>
      </button>
    </div>
    <form id="quickMoneySplitForm" class="modal-body form-stack" novalidate>
      <div class="segmented" id="moneySplitDirection" role="group" aria-label="Direction">
        <button class="segmented-btn" type="button" data-value="in">
          <i data-lucide="arrow-down-circle" class="icon"></i>
          <span data-i18n="quick.incoming">Incoming</span>
        </button>
        <button class="segmented-btn is-active" type="button" data-value="out">
          <i data-lucide="arrow-up-circle" class="icon"></i>
          <span data-i18n="quick.outgoing">Outgoing</span>
        </button>
      </div>

      <div class="chip-row" id="moneySplitPersonType" role="group" aria-label="Person type">
        <button class="chip is-active" type="button" data-value="supplier"><i data-lucide="truck" class="icon"></i><span data-i18n="quick.supplier">Supplier</span></button>
        <button class="chip" type="button" data-value="contractor"><i data-lucide="hard-hat" class="icon"></i><span data-i18n="quick.contractor">Contractor</span></button>
        <button class="chip" type="button" data-value="client"><i data-lucide="user" class="icon"></i><span data-i18n="quick.client">Client</span></button>
        <button class="chip" type="button" data-value="other"><i data-lucide="more-horizontal" class="icon"></i><span data-i18n="quick.other">Other</span></button>
      </div>

      <div class="form-field" id="moneySplitPersonField">
        <label class="form-label" data-i18n="quick.person">Person</label>
        <div class="field-with-action">
          <select class="form-input" id="moneySplitPersonSelect"></select>
          <button class="btn btn-soft btn-icon" id="moneySplitAddPersonBtn" type="button" data-i18n-aria="quickAdd.add" aria-label="Quick add person" title="Quick add person">
            <i data-lucide="plus" class="icon"></i>
          </button>
        </div>
        <input class="form-input" id="moneySplitPersonName" type="text" hidden data-i18n-ph="quick.personNamePh" placeholder="Person name" />
      </div>

      <div class="form-field">
        <label class="form-label" for="moneySplitTotalAmount" data-i18n="quick.totalAmount">Total Amount</label>
        <input class="form-input" id="moneySplitTotalAmount" name="totalAmount" type="number" min="0" step="0.01" required data-i18n-ph="quick.amountPh" placeholder="0" />
      </div>

      <div class="form-field">
        <label class="form-label" for="moneySplitNote" data-i18n="quick.note">Note (optional)</label>
        <input class="form-input" id="moneySplitNote" name="note" type="text" data-i18n-ph="quick.notePh" placeholder="—" />
      </div>

      <div class="form-field">
        <div class="form-field-head">
          <label class="form-label" data-i18n="quick.splitProjects">Split Across Projects</label>
          <span class="form-hint" data-i18n="quick.splitHint">Sum must equal total amount</span>
        </div>
        <div id="moneySplitProjectsContainer" class="split-projects-container"></div>
        <button type="button" class="btn btn-soft btn-sm" id="moneySplitAddProject" data-i18n="quick.addProjectRow">+ Add Project</button>
      </div>

      <div class="split-summary" id="moneySplitSummary" hidden>
        <div class="split-summary-row">
          <span data-i18n="quick.splitAllocated">Allocated:</span>
          <span id="moneySplitAllocated" class="split-summary-value">0</span>
        </div>
        <div class="split-summary-row">
          <span data-i18n="quick.splitRemaining">Remaining:</span>
          <span id="moneySplitRemaining" class="split-summary-value is-remaining">0</span>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn btn-ghost" id="quickMoneySplitCancel" type="button" data-i18n="projects.cancel">Cancel</button>
        <button class="btn btn-primary" type="submit" data-i18n="quick.save">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- Invoice Lightbox Viewer (shared — opened by JS openInvoiceLightbox()) -->
<div class="modal-overlay" id="invoiceLightbox" hidden>
  <div class="modal modal-lg invoice-lightbox-modal" role="dialog" aria-modal="true" aria-label="Invoice viewer">
    <div class="modal-header">
      <h2 class="modal-title" id="invoiceLightboxTitle">الفاتورة / Invoice</h2>
      <div style="display:flex;gap:8px;align-items:center;">
        <a id="invoiceLightboxDownload" class="btn btn-soft btn-sm" download="invoice" aria-label="Download invoice">
          <i data-lucide="download" class="icon"></i>
          <span>تحميل</span>
        </a>
        <button class="btn btn-icon modal-close" id="invoiceLightboxClose" type="button" aria-label="Close">
          <i data-lucide="x" class="icon"></i>
        </button>
      </div>
    </div>
    <div class="modal-body invoice-lightbox-body" id="invoiceLightboxBody">
      <!-- filled dynamically by openInvoiceLightbox() -->
    </div>
  </div>
</div>
