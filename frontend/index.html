<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("spark_theme");
        if (t !== "dark" && t !== "light") t = "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1e293b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Spark ERP" />
  <link rel="apple-touch-icon" href="./assets/icons/favicon.svg" />
  <link rel="manifest" href="./manifest.json" />
  <style>
    svg { max-width: 100%; }
    .navbar-logo svg, .auth-logo svg, .preloader-icon-svg { width: 24px; height: 24px; max-width: 24px; max-height: 24px; }
  </style>
  <meta http-equiv="refresh" content="0; url=./pages/login.html" />
  <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg" />
  <title>Redirecting…</title>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js", { scope: "/" }).catch(function(){});
    }
    window.location.replace("./pages/login.html");
  </script>
</head>
<body></body>
</html>
