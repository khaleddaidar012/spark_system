<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Spark Engineering ERP System — Financial Accounts" />
  <title>Financial Accounts | Spark ERP</title>
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg" />
  <link rel="stylesheet" href="../assets/css/main.css" />
</head>
<body data-page="finance">
  <div class="app-layout">
    <div id="navbar-root"></div>

    <div class="app-body">
      <div id="sidebar-root"></div>

      <main class="app-main">
        <div class="app-content">
          <header class="page-header">
            <h1 class="page-title" data-i18n="finance.title">Financial Accounts</h1>
            <p class="page-subtitle text-muted" data-i18n="finance.subtitle">Monitor income, expenses and cash flow.</p>
          </header>

          <section class="finance-summary" aria-label="Financial summary">
            <div class="finance-card is-in">
              <span class="finance-card-icon" aria-hidden="true"><i data-lucide="arrow-down-circle" class="icon"></i></span>
              <span class="finance-card-label" data-i18n="finance.totalIn">Total Incoming</span>
              <span class="finance-card-value" id="financeIn">0</span>
            </div>
            <div class="finance-card is-out">
              <span class="finance-card-icon" aria-hidden="true"><i data-lucide="arrow-up-circle" class="icon"></i></span>
              <span class="finance-card-label" data-i18n="finance.totalOut">Total Outgoing</span>
              <span class="finance-card-value" id="financeOut">0</span>
            </div>
            <div class="finance-card is-net">
              <span class="finance-card-icon" aria-hidden="true"><i data-lucide="scale" class="icon"></i></span>
              <span class="finance-card-label" data-i18n="finance.net">Net Balance</span>
              <span class="finance-card-value" id="financeNet">0</span>
            </div>
          </section>

          <section class="card detail-section detail-section-block">
            <h2 class="detail-section-title" data-i18n="finance.history">Transaction History</h2>
            <div id="financeList" class="rows-list"></div>
            <div id="financeEmpty" class="placeholder" hidden>
              <i data-lucide="wallet" class="icon"></i>
              <p data-i18n="finance.emptyDesc">No transactions yet. Use the + button for quick entry.</p>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <script src="../assets/vendor/lucide/lucide.min.js"></script>
  <script type="module" src="../assets/js/pages/finance.js"></script>
</body>
</html>
