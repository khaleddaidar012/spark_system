<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("spark_theme");
        if (t !== "dark" && t !== "light") t = "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Spark Engineering ERP System — Contractors" />
  <title>Contractors | Spark ERP</title>
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg" />
  <link rel="stylesheet" href="../assets/css/main.css" />
</head>
<body data-page="contractors">
  <div class="app-layout">
    <div id="navbar-root"></div>

    <div class="app-body">
      <div id="sidebar-root"></div>

      <main class="app-main">
        <div class="app-content">
          <header class="page-header page-header-row">
            <div>
              <h1 class="page-title" data-i18n="contractors.title">Contractors</h1>
              <p class="page-subtitle text-muted" data-i18n="contractors.subtitle">Manage contractors and track their payments.</p>
            </div>
            <button class="btn btn-primary" id="addContractorBtn" type="button">
              <i data-lucide="plus" class="icon"></i>
              <span data-i18n="contractors.addContractor">Add Contractor</span>
            </button>
          </header>

          <section id="contractorsList" class="rows-list" aria-label="Contractors list"></section>
          <section id="contractorsEmpty" class="empty-state" hidden>
            <span class="empty-state-icon" aria-hidden="true"><i data-lucide="hard-hat" class="icon"></i></span>
            <h2 class="empty-state-title" data-i18n="contractors.emptyTitle">No contractors yet</h2>
            <p class="empty-state-desc" data-i18n="contractors.emptyDesc">Add your first contractor to track their work and payments.</p>
          </section>
        </div>
      </main>
    </div>
  </div>

  <div class="modal-overlay" id="contractorModal" hidden>
    <div class="modal modal-sm" role="dialog" aria-modal="true" aria-labelledby="contractorModalTitle">
      <div class="modal-header">
        <h2 class="modal-title" id="contractorModalTitle" data-i18n="contractors.modalTitle">Add Contractor</h2>
        <button class="btn btn-icon modal-close" id="contractorModalClose" type="button" aria-label="Close">
          <i data-lucide="x" class="icon"></i>
        </button>
      </div>
      <form id="contractorForm" class="modal-body form-stack" novalidate>
        <div class="form-field">
          <label class="form-label" for="conName" data-i18n="contractors.formName">Contractor Name</label>
          <input class="form-input" id="conName" name="name" type="text" required data-i18n-ph="contractors.formNamePh" placeholder="e.g. Plumbing Contractor" />
        </div>
        <div class="form-field">
          <label class="form-label" for="conRole" data-i18n="contractors.formRole">Role</label>
          <select class="form-input" id="conRole" name="role">
            <option value="plumbing" data-i18n="project.rolePlumbing">Plumbing</option>
            <option value="electrical" data-i18n="project.roleElectrical">Electrical</option>
            <option value="finishing" data-i18n="project.roleFinishing">Finishing</option>
            <option value="painting" data-i18n="project.rolePainting">Painting</option>
            <option value="tiles" data-i18n="project.roleTiles">Tiles</option>
            <option value="other" data-i18n="project.roleOther">Other</option>
          </select>
        </div>
        <div class="form-field">
          <label class="form-label" for="conPhone" data-i18n="contractors.formPhone">Phone</label>
          <input class="form-input" id="conPhone" name="phone" type="text" data-i18n-ph="contractors.formPhonePh" placeholder="01xxxxxxxxx" />
        </div>
        <div class="form-row">
          <div class="form-field">
            <label class="form-label" for="conTotal" data-i18n="contractors.formTotal">Total Cost</label>
            <input class="form-input" id="conTotal" name="total" type="number" min="0" step="0.01" required data-i18n-ph="contractors.formTotalPh" placeholder="0" />
          </div>
          <div class="form-field">
            <label class="form-label" for="conPaid" data-i18n="contractors.formPaid">Paid</label>
            <input class="form-input" id="conPaid" name="paid" type="number" min="0" step="0.01" data-i18n-ph="contractors.formPaidPh" placeholder="0" />
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn btn-ghost" id="contractorFormCancel" type="button" data-i18n="projects.cancel">Cancel</button>
          <button class="btn btn-primary" type="submit" data-i18n="projects.save">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="settleModal" hidden>
    <div class="modal modal-sm" role="dialog" aria-modal="true" aria-labelledby="settleModalTitle">
      <div class="modal-header">
        <h2 class="modal-title" id="settleModalTitle" data-i18n="contractors.settleModalTitle">Settle Account</h2>
        <button class="btn btn-icon modal-close" id="settleModalClose" type="button" aria-label="Close">
          <i data-lucide="x" class="icon"></i>
        </button>
      </div>
      <form id="settleForm" class="modal-body form-stack" novalidate>
        <div class="form-field">
          <label class="form-label" for="settleAmount" data-i18n="contractors.settleAmount">Amount</label>
          <input class="form-input" id="settleAmount" name="amount" type="number" min="0" step="0.01" required data-i18n-ph="project.formConTotalPh" placeholder="0" />
        </div>
        <div class="form-field">
          <label class="form-label" for="settleNote" data-i18n="contractors.settleNote">Note (optional)</label>
          <input class="form-input" id="settleNote" name="note" type="text" data-i18n-ph="quick.notePh" placeholder="—" />
        </div>
        <div class="modal-actions">
          <button class="btn btn-ghost" id="settleCancel" type="button" data-i18n="projects.cancel">Cancel</button>
          <button class="btn btn-primary" type="submit" data-i18n="projects.save">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="projectsModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="projectsModalTitle">
      <div class="modal-header">
        <h2 class="modal-title" id="projectsModalTitle" data-i18n="contractors.projectsTitle">Contractor Projects</h2>
        <button class="btn btn-icon modal-close" id="projectsModalClose" type="button" aria-label="Close">
          <i data-lucide="x" class="icon"></i>
        </button>
      </div>
      <div class="modal-body" id="projectsModalBody"></div>
    </div>
  </div>

  <div class="modal-overlay" id="contractorAccountModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="contractorAccountTitle">
      <div class="modal-header">
        <h2 class="modal-title" id="contractorAccountTitle" data-i18n="contractors.accountTitle">Account & Transactions</h2>
        <button class="btn btn-icon modal-close" id="contractorAccountClose" type="button" aria-label="Close">
          <i data-lucide="x" class="icon"></i>
        </button>
      </div>
      <div class="modal-body">
        <div class="account-summary" id="contractorAccountSummary"></div>
        <h3 class="detail-section-title" data-i18n="contractors.transactions">Transactions</h3>
        <div id="contractorAccountList" class="rows-list"></div>
        <p class="row-empty" id="contractorAccountEmpty" hidden data-i18n="contractors.noTransactions">No transactions yet.</p>
      </div>
    </div>
  </div>

  <script src="../assets/vendor/lucide/lucide.min.js"></script>
  <script type="module" src="../assets/js/pages/contractors.js"></script>
</body>
</html>
