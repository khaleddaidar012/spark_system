<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Spark Engineering ERP System — Login" />
  <title>Login | Spark ERP</title>
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg" />
  <link rel="stylesheet" href="../assets/css/main.css" />
</head>
<body class="auth-page">

  <!-- Theme & Language switchers (top corner) -->
  <div class="auth-toolbar">
    <button class="btn btn-icon" id="themeToggle" type="button" aria-label="Toggle theme" title="Toggle theme">
      <i data-lucide="moon" class="icon" data-theme-icon="dark"></i>
      <i data-lucide="sun" class="icon" data-theme-icon="light" style="display:none;"></i>
    </button>
    <button class="btn btn-icon" id="langToggle" type="button" aria-label="Switch language" title="العربية">ع</button>
  </div>

  <main class="auth-layout">
    <div class="auth-card">
      <!-- Company logo placeholder -->
      <div class="auth-logo" aria-hidden="true">
        <svg class="auth-logo-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
      </div>

      <h1 class="auth-title" data-i18n="appName">Spark Engineering</h1>
      <p class="auth-subtitle" data-i18n="login.subtitle">Sign in to your account</p>

      <form class="auth-form" id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="username" data-i18n="login.username">Username</label>
          <input
            class="form-input"
            type="text"
            id="username"
            name="username"
            placeholder="Enter your username"
            data-i18n-ph="login.usernamePh"
            autocomplete="username"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="password" data-i18n="login.password">Password</label>
          <div class="form-input-wrapper">
            <input
              class="form-input"
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              data-i18n-ph="login.passwordPh"
              autocomplete="current-password"
              required
            />
            <button
              class="input-toggle"
              type="button"
              id="togglePassword"
              aria-label="Show password"
              data-i18n-aria="login.showPassword"
            >
              <i data-lucide="eye" class="icon" id="iconEye"></i>
              <i data-lucide="eye-off" class="icon" id="iconEyeOff" style="display:none;"></i>
            </button>
          </div>
        </div>

        <div class="auth-options">
          <label class="form-check">
            <input type="checkbox" id="rememberMe" name="rememberMe" />
            <span class="form-check-label" data-i18n="login.rememberMe">Remember me</span>
          </label>
          <a href="#" class="auth-forgot" data-i18n="login.forgot">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginBtn" data-i18n="login.button">
          Sign In
        </button>
      </form>

      <p class="auth-error" id="loginError" role="alert" hidden></p>

      <p class="auth-footer" data-i18n="login.footer">© Spark Engineering Company</p>
    </div>
  </main>

  <script src="../assets/vendor/lucide/lucide.min.js"></script>
  <script type="module" src="../assets/js/pages/login.js"></script>
</body>
</html>
