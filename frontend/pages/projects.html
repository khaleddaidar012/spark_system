<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Spark Engineering ERP System — Projects" />
  <title>Projects | Spark ERP</title>
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg" />
  <link rel="stylesheet" href="../assets/css/main.css" />
</head>
<body data-page="projects">
  <div class="app-layout">
    <div id="navbar-root"></div>

    <div class="app-body">
      <div id="sidebar-root"></div>

      <main class="app-main">
        <div class="app-content">
          <header class="page-header page-header-row">
            <div>
              <h1 class="page-title" data-i18n="projects.title">Projects</h1>
              <p class="page-subtitle text-muted" data-i18n="projects.subtitle">Plan, track and deliver engineering projects.</p>
            </div>
            <button class="btn btn-primary btn-lg" id="addProjectBtn" type="button">
              <i data-lucide="plus" class="icon"></i>
              <span data-i18n="projects.addProject">Add Project</span>
            </button>
          </header>

          <section id="projectsGrid" class="projects-grid" aria-label="Projects list"></section>

          <section id="projectsEmpty" class="empty-state" hidden>
            <span class="empty-state-icon" aria-hidden="true">
              <i data-lucide="folder-open" class="icon"></i>
            </span>
            <h2 class="empty-state-title" data-i18n="projects.emptyTitle">No projects yet</h2>
            <p class="empty-state-desc" data-i18n="projects.emptyDesc">Create your first project to start tracking costs and progress.</p>
            <button class="btn btn-primary" id="emptyAddBtn" type="button">
              <i data-lucide="plus" class="icon"></i>
              <span data-i18n="projects.addProject">Add Project</span>
            </button>
          </section>
        </div>
      </main>
    </div>
  </div>

  <!-- Complete project confirmation modal -->
  <div class="modal-overlay" id="completeModal" hidden>
    <div class="modal modal-sm" role="dialog" aria-modal="true" aria-labelledby="completeModalTitle">
      <div class="modal-header">
        <h2 class="modal-title" id="completeModalTitle" data-i18n="projects.confirmCompleteTitle">Complete Project?</h2>
        <button class="btn btn-icon modal-close" id="completeModalClose" type="button" aria-label="Close">
          <i data-lucide="x" class="icon"></i>
        </button>
      </div>
      <div class="modal-body">
        <p class="confirm-desc" data-i18n="projects.confirmCompleteDesc">
          This will mark the project as Completed and set its progress to 100%. Continue?
        </p>
        <div class="modal-actions">
          <button class="btn btn-ghost" id="completeCancel" type="button" data-i18n="projects.cancel">Cancel</button>
          <button class="btn btn-primary" id="completeConfirm" type="button">
            <i data-lucide="check" class="icon"></i>
            <span data-i18n="projects.confirm">Confirm</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Create project modal -->
  <div class="modal-overlay" id="projectModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="projectModalTitle">
      <div class="modal-header">
        <h2 class="modal-title" id="projectModalTitle" data-i18n="projects.modalTitle">New Project</h2>
        <button class="btn btn-icon modal-close" id="projectModalClose" type="button" aria-label="Close">
          <i data-lucide="x" class="icon"></i>
        </button>
      </div>
      <form id="projectForm" class="modal-body form-stack" novalidate>
        <div class="form-field">
          <label class="form-label" for="projName" data-i18n="projects.formName">Project Name</label>
          <input class="form-input" id="projName" name="name" type="text" required data-i18n-ph="projects.formNamePh" placeholder="e.g. Apartment 150 m²" />
        </div>
        <div class="form-field">
          <label class="form-label" for="projType" data-i18n="projects.formType">Project Type</label>
          <select class="form-input" id="projType" name="type" required>
            <option value="apartment" data-i18n="projects.typeApartment">Apartment</option>
            <option value="villa" data-i18n="projects.typeVilla">Villa</option>
            <option value="clinic" data-i18n="projects.typeClinic">Clinic</option>
            <option value="office" data-i18n="projects.typeOffice">Office</option>
            <option value="shop" data-i18n="projects.typeShop">Shop</option>
            <option value="other" data-i18n="projects.typeOther">Other</option>
          </select>
        </div>
        <div class="form-row">
          <div class="form-field">
            <label class="form-label" for="projArea" data-i18n="projects.formArea">Area (m²)</label>
            <input class="form-input" id="projArea" name="area" type="number" min="0" step="0.01" required data-i18n-ph="projects.formAreaPh" placeholder="e.g. 150" />
          </div>
          <div class="form-field">
            <label class="form-label" for="projAdvance" data-i18n="projects.formAdvance">Advance Payment</label>
            <input class="form-input" id="projAdvance" name="advancePayment" type="number" min="0" step="0.01" value="0" data-i18n-ph="projects.formAdvancePh" placeholder="0" />
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn btn-ghost" id="projectFormCancel" type="button" data-i18n="projects.cancel">Cancel</button>
          <button class="btn btn-primary" type="submit" data-i18n="projects.save">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../assets/vendor/lucide/lucide.min.js"></script>
  <script type="module" src="../assets/js/pages/projects.js"></script>
</body>
</html>
