<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Spark Engineering ERP System — Dashboard" />
  <title>Dashboard | Spark ERP</title>
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg" />
  <link rel="stylesheet" href="../assets/css/main.css" />
</head>
<body data-page="dashboard">
  <div class="app-layout">
    <!-- Reusable sidebar injected by layout module -->
    <div id="sidebar-root"></div>

    <div class="app-main">
      <!-- Reusable navbar injected by layout module -->
      <div id="navbar-root"></div>

      <main class="app-content">
        <!-- Page header -->
        <div class="page-header">
          <div>
            <h1 class="page-title" data-i18n="dashboard.title">Dashboard</h1>
            <p class="page-subtitle text-muted" data-i18n="dashboard.welcome">
              Welcome back — here's what's happening today.
            </p>
          </div>
          <div class="page-actions">
            <button class="btn btn-outline" type="button">
              <i data-lucide="folder-plus" class="icon"></i>
              <span data-i18n="dashboard.newProject">New Project</span>
            </button>
            <button class="btn btn-primary" type="button">
              <i data-lucide="circle-plus" class="icon"></i>
              <span data-i18n="dashboard.quickEntry">Quick Entry</span>
            </button>
          </div>
        </div>

        <!-- Statistics -->
        <section class="dashboard-stats" aria-label="Statistics">
          <article class="card stat-card is-primary">
            <div class="stat-card-top">
              <span class="stat-icon icon-primary" aria-hidden="true">
                <i data-lucide="folder" class="icon"></i>
              </span>
              <span class="stat-trend up">
                <i data-lucide="arrow-up-right" class="icon"></i>+12%
              </span>
            </div>
            <p class="stat-value" data-stat="projects" data-i18n="dashboard.stats.totalProjects">0</p>
            <p class="stat-label" data-i18n="dashboard.stats.totalProjectsLabel">Total Projects</p>
          </article>

          <article class="card stat-card is-success">
            <div class="stat-card-top">
              <span class="stat-icon icon-success" aria-hidden="true">
                <i data-lucide="dollar-sign" class="icon"></i>
              </span>
              <span class="stat-trend up">
                <i data-lucide="arrow-up-right" class="icon"></i>+8%
              </span>
            </div>
            <p class="stat-value" data-stat="income" data-prefix="$" data-i18n="dashboard.stats.totalIncome">0</p>
            <p class="stat-label" data-i18n="dashboard.stats.totalIncomeLabel">Total Income</p>
          </article>

          <article class="card stat-card is-danger">
            <div class="stat-card-top">
              <span class="stat-icon icon-danger" aria-hidden="true">
                <i data-lucide="credit-card" class="icon"></i>
              </span>
              <span class="stat-trend down">
                <i data-lucide="arrow-down-right" class="icon"></i>-4%
              </span>
            </div>
            <p class="stat-value" data-stat="expenses" data-prefix="$" data-i18n="dashboard.stats.totalExpenses">0</p>
            <p class="stat-label" data-i18n="dashboard.stats.totalExpensesLabel">Total Expenses</p>
          </article>

          <article class="card stat-card is-accent">
            <div class="stat-card-top">
              <span class="stat-icon icon-accent" aria-hidden="true">
                <i data-lucide="trending-up" class="icon"></i>
              </span>
              <span class="stat-trend up">
                <i data-lucide="arrow-up-right" class="icon"></i>+15%
              </span>
            </div>
            <p class="stat-value" data-stat="profit" data-prefix="$" data-i18n="dashboard.stats.netProfit">0</p>
            <p class="stat-label" data-i18n="dashboard.stats.netProfitLabel">Net Profit</p>
          </article>
        </section>
      </main>
    </div>
  </div>

  <script src="../assets/vendor/lucide/lucide.min.js"></script>
  <script type="module" src="../assets/js/pages/dashboard.js"></script>
</body>
</html>
