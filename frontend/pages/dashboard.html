<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Spark Engineering ERP System — Dashboard" />
  <title>Dashboard | Spark ERP</title>
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg" />
  <link rel="stylesheet" href="../assets/css/main.css" />
</head>
<body data-page="dashboard">
  <div class="app-layout">
    <!-- Reusable navbar injected by layout module -->
    <div id="navbar-root"></div>

    <div class="app-body">
      <!-- Reusable sidebar injected by layout module -->
      <div id="sidebar-root"></div>

      <main class="app-main">
        <div class="app-content">
          <header class="page-header">
            <h1 class="page-title" data-i18n="dashboard.title">Dashboard</h1>
            <p class="page-subtitle text-muted" data-i18n="dashboard.welcome">Welcome back</p>
          </header>

          <section class="dashboard-modules" aria-label="Modules">
            <a class="module-card" href="./projects.html">
              <span class="module-card-icon icon-primary" aria-hidden="true">
                <i data-lucide="folder" class="icon"></i>
              </span>
              <div class="module-card-body">
                <h2 class="module-card-title" data-i18n="dashboard.projectsTitle">Projects</h2>
                <p class="module-card-desc" data-i18n="dashboard.projectsDesc">
                  Plan, track and deliver engineering projects.
                </p>
              </div>
              <span class="module-card-arrow" aria-hidden="true">
                <i data-lucide="arrow-right" class="icon"></i>
              </span>
            </a>

            <a class="module-card" href="./suppliers.html">
              <span class="module-card-icon icon-success" aria-hidden="true">
                <i data-lucide="truck" class="icon"></i>
              </span>
              <div class="module-card-body">
                <h2 class="module-card-title" data-i18n="dashboard.suppliersTitle">Suppliers</h2>
                <p class="module-card-desc" data-i18n="dashboard.suppliersDesc">
                  Manage suppliers and material purchases.
                </p>
              </div>
              <span class="module-card-arrow" aria-hidden="true">
                <i data-lucide="arrow-right" class="icon"></i>
              </span>
            </a>

            <a class="module-card" href="./finance.html">
              <span class="module-card-icon icon-accent" aria-hidden="true">
                <i data-lucide="wallet" class="icon"></i>
              </span>
              <div class="module-card-body">
                <h2 class="module-card-title" data-i18n="dashboard.financeTitle">Financial Accounts</h2>
                <p class="module-card-desc" data-i18n="dashboard.financeDesc">
                  Monitor income, expenses and cash flow.
                </p>
              </div>
              <span class="module-card-arrow" aria-hidden="true">
                <i data-lucide="arrow-right" class="icon"></i>
              </span>
            </a>

            <a class="module-card" href="./contractors.html">
              <span class="module-card-icon icon-info" aria-hidden="true">
                <i data-lucide="hard-hat" class="icon"></i>
              </span>
              <div class="module-card-body">
                <h2 class="module-card-title" data-i18n="dashboard.contractorsTitle">Contractors</h2>
                <p class="module-card-desc" data-i18n="dashboard.contractorsDesc">
                  Manage contractors and track their payments.
                </p>
              </div>
              <span class="module-card-arrow" aria-hidden="true">
                <i data-lucide="arrow-right" class="icon"></i>
              </span>
            </a>
          </section>
        </div>
      </main>
    </div>
  </div>

  <script src="../assets/vendor/lucide/lucide.min.js"></script>
  <script type="module" src="../assets/js/pages/dashboard.js"></script>
</body>
</html>
